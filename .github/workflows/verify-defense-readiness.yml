name: Verify TVTMS defense-readiness branch (NO DEPLOY)

on:
  push:
    branches:
      - feature/tvtms-defense-readiness

permissions:
  contents: read

jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install pytest
          echo "TVTMS_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "TVTMS_PHP=$(command -v php)" >> "$GITHUB_ENV"
      - name: Identify dependency advisories without modifying packages
        run: |
          npm audit --json > "$RUNNER_TEMP/tvtms-audit.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/tvtms-audit-production.json" || true
          node - "$RUNNER_TEMP/tvtms-audit.json" "$RUNNER_TEMP/tvtms-audit-production.json" <<'NODE'
          const fs=require('fs');
          for(const [index,file] of process.argv.slice(2).entries()) {
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            console.log(index===0?'FULL DEPENDENCY AUDIT':'PRODUCTION DEPENDENCY AUDIT');
            console.log(JSON.stringify({counts:report.metadata?.vulnerabilities,packages:Object.entries(report.vulnerabilities||{}).map(([name,entry])=>({name,severity:entry.severity,isDirect:entry.isDirect,range:entry.range,via:entry.via.map(issue=>typeof issue==='string'?issue:{name:issue.name,title:issue.title,url:issue.url,range:issue.range}),fixAvailable:entry.fixAvailable}))},null,2));
          }
          NODE
      - name: Check syntax and PHP version
        run: |
          set -euo pipefail
          php -r 'exit(PHP_VERSION_ID >= 80100 ? 0 : 1);'
          find api -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          npm run verify:jsx
      - name: Execute complete regression suite
        run: npm test
      - name: Build production-style package without uploading
        run: |
          npm run build:hostinger
          test -f deploy/index.html
          test -f deploy/api/index.php
          test ! -e deploy/api/config/config.local.php
          test ! -e deploy/uploads
          test ! -e deploy/.env
          test ! -e deploy/.env.local
      - name: Archive verified tracked source for isolated testing (not a deployment)
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(config\.local\.php|\.env(\..*)?|\.npmrc|id_rsa|id_ed25519)$'; then
            echo 'Refusing to archive: potential credential file is tracked.' >&2
            exit 1
          fi
          git archive --format=zip -o verified-feature-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: verified-feature-source
          path: verified-feature-source.zip
          retention-days: 1
          if-no-files-found: error
