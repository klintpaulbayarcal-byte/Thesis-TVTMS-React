name: Deploy TVTMS React v4 to Hostinger (one-time guarded)

# One-time deployment request: only a change to this workflow on sync-v4
# triggers a run. Future application commits never deploy automatically.
on:
  push:
    branches: [sync-v4]
    paths: ['.github/workflows/deploy-hostinger-v4.yml']

permissions:
  contents: read

concurrency:
  group: tvtms-hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TVTMS_TOKEN_SECRET: ${{ secrets.TVTMS_TOKEN_SECRET }}
    steps:
      - name: Check out approved sync-v4 source
        uses: actions/checkout@v4

      - name: Require exactly the verified FTP destination and configured secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" || { echo 'FTP_SERVER secret is missing'; exit 1; }
          test -n "$FTP_USERNAME" || { echo 'FTP_USERNAME secret is missing'; exit 1; }
          test -n "$FTP_PASSWORD" || { echo 'FTP_PASSWORD secret is missing'; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo 'SUPABASE_SECRET_KEY secret is missing'; exit 1; }
          test -n "$TVTMS_TOKEN_SECRET" || { echo 'TVTMS_TOKEN_SECRET secret is missing'; exit 1; }
          test "${#TVTMS_TOKEN_SECRET}" -ge 32 || { echo 'TVTMS_TOKEN_SECRET must contain at least 32 characters'; exit 1; }
          test "$FTP_SERVER" = '145.223.108.219' || { echo 'FTP_SERVER differs from the approved screenshot; stopping'; exit 1; }
          test "$FTP_USERNAME" = 'u948876618.trafficviolation' || { echo 'FTP_USERNAME differs from the approved subdomain FTP account; stopping'; exit 1; }
          echo 'Required secret names are populated and destination matches the approved FTP account.'

      - name: Install build/test dependencies and secure FTP client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp openssl php-cli >/dev/null

      - name: Preflight Hostinger certificate and remote subdomain root (NO WRITES)
        shell: bash
        run: |
          set -euo pipefail
          # Hostinger supplied an IP-only FTP endpoint, while its CA-issued certificate
          # identifies *.hstgr.io. Verify the chain and Hostinger SAN before disabling
          # only lftp's impossible IP-to-DNS-name comparison. Encryption stays mandatory.
          certificate="$(timeout 20 openssl s_client -connect "$FTP_SERVER:21" -starttls ftp -verify_return_error </dev/null 2>/tmp/tvtms-ftps-certificate.log | openssl x509 -noout -subject -ext subjectAltName)"
          grep -Fq 'DNS:*.hstgr.io' <<<"$certificate" || { echo 'FTPS certificate is not issued for Hostinger (*.hstgr.io); stopping'; exit 1; }
          options='set cmd:fail-exit yes; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname no; set ftp:passive-mode yes; set net:timeout 15; set net:max-retries 1;'
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p 21 "$FTP_SERVER" -e "$options cls -1 /; bye"
          echo 'CA-verified Hostinger FTPS and account-root login verified. No remote files changed.'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify source and build Hostinger package
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python -m pip install pytest
          export TVTMS_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export TVTMS_PHP="$(command -v php)"
          npm run verify:jsx
          find api -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          npm run build:hostinger
          npm test
          test -f deploy/index.html
          test -f deploy/api/index.php
          test -f deploy/.htaccess
          test -f deploy/api/.htaccess
          test ! -e deploy/uploads
          test ! -e deploy/api/config/config.local.php
          test ! -e deploy/.env
          test ! -e deploy/.env.local

      - name: Create private production API config from GitHub Secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          php <<'PHP'
          <?php
          $supabaseSecret = trim((string) getenv('SUPABASE_SECRET_KEY'));
          $tokenSecret = trim((string) getenv('TVTMS_TOKEN_SECRET'));
          if ($supabaseSecret === '' || strlen($tokenSecret) < 32) {
              fwrite(STDERR, "Production API secrets are missing or invalid.\n");
              exit(1);
          }
          $config = [
              'supabase_url' => 'https://cwrhxvrmnfmzuxotsjrw.supabase.co',
              'supabase_secret_key' => $supabaseSecret,
              'token_secret' => $tokenSecret,
              'token_ttl_seconds' => 28800,
              'app_public_url' => 'https://trafficviolation.dcsbisu.com',
              'timezone' => 'Asia/Manila',
              'development' => false,
              'smtp' => [
                  'enabled' => false,
                  'host' => '',
                  'port' => 587,
                  'secure' => 'tls',
                  'username' => '',
                  'password' => '',
                  'from_email' => '',
                  'from_name' => 'TVTMS',
              ],
          ];
          $target = 'deploy/api/config/config.local.php';
          if (file_put_contents($target, "<?php\nreturn " . var_export($config, true) . ";\n") === false) {
              fwrite(STDERR, "Unable to create the private production API config.\n");
              exit(1);
          }
          PHP
          chmod 600 deploy/api/config/config.local.php
          php -l deploy/api/config/config.local.php
          echo 'Private production API config created without printing secret values.'

      - name: Upload verified build and private config (NO DELETE, uploads excluded)
        shell: bash
        run: |
          set -euo pipefail
          options='set cmd:fail-exit yes; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname no; set ftp:passive-mode yes; set net:timeout 20; set net:max-retries 2;'
          # lftp mirror -R does not delete remote files without --delete. --all transfers .htaccess.
          # Runtime uploads are never packaged or changed by this release.
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p 21 "$FTP_SERVER" -e "$options mirror -R --all --verbose --no-perms --parallel=2 --exclude-glob uploads/ ./deploy/ /; bye"
          echo 'FTP upload finished; verifying live site next.'

      - name: Check production website and API health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 'https://trafficviolation.dcsbisu.com/' -o /tmp/tvtms-live-index.html
          grep -q 'assets/' /tmp/tvtms-live-index.html
          curl --fail --silent --show-error --location --max-time 30 'https://trafficviolation.dcsbisu.com/api/health' -o /tmp/tvtms-health.json
          php -r '$x=json_decode(file_get_contents("/tmp/tvtms-health.json"),true); exit(is_array($x)&&($x["success"]??false)===true&&($x["database"]??"")==="connected"?0:1);'
          echo 'Live homepage and Supabase-connected PHP API health verified.'
