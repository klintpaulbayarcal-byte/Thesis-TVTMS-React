name: TVTMS targeted email and dispute tests (NO DEPLOY)

on:
  pull_request:
    branches:
      - sync-v4
  push:
    branches:
      - fix/email-preferences-dispute-diagnostics-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm PHP runtime
        run: |
          php -v
          php -r 'exit(PHP_VERSION_ID >= 80100 ? 0 : 1);'
      - name: Lint changed PHP code
        run: |
          php -l api/src/common.php
          php -l api/src/handlers/tickets.php
          php -l api/src/handlers/payments.php
          php -l api/src/handlers/public.php
      - name: Offline regressions
        run: |
          python -m pip install pytest
          TVTMS_PHP="$(command -v php)" python -m pytest -q tests/test_email_preference_dispute_guard.py
